[project]
name = "axiomcart"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sreenath T.", email = "SRET650@kellyservices.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.2",
    "httpx>=0.27.0",
    "langchain-core>=1.6.12",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
axiomcart = "axiomcart:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
